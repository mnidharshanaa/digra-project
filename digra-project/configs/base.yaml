# =============================================================================
# base.yaml — Master experiment configuration.
#
# Nothing in src/ should ever hardcode a dataset path, model name, seed,
# or hyperparameter. Everything that could plausibly change between runs
# or ablations lives here. Scripts load this via src/utils/config.py.
# =============================================================================

project:
  name: "digra-rag-memory"
  # Root for all persisted artifacts. On Kaggle this should point at
  # /kaggle/working/ (session-local) with periodic sync to a Kaggle Dataset
  # (persistent across sessions) — see src/utils/checkpoint.py.
  output_root: "results"
  seeds: [0, 1, 2, 3]          # reused identically across every method/dataset

# -----------------------------------------------------------------------------
# Models under test. `hf_id` must match a HuggingFace repo you have access to.
# `role` distinguishes the debate-generation model from the (optional, cheaper)
# entropy-estimation proxy model discussed in Appendix C-3 of the DIGRA paper.
# -----------------------------------------------------------------------------
models:
  llama:
    hf_id: "meta-llama/Llama-3.1-8B-Instruct"
    role: "debate"
    dtype: "bfloat16"
    max_model_len: 4096
  mistral:
    hf_id: "mistralai/Mistral-7B-Instruct-v0.3"
    role: "debate"
    dtype: "bfloat16"
    max_model_len: 4096
  entropy_proxy: null            # e.g. a smaller model id if using a cheaper
                                  # proxy for entropy estimation; null = use
                                  # the debate model itself for entropy too

# -----------------------------------------------------------------------------
# Datasets — paths are filled in after scripts/00_fetch_farm.py runs.
# `logical_field` names the FARM column holding the "logical" persuasion
# strategy passage used as the seeded incorrect response.
# -----------------------------------------------------------------------------
datasets:
  nq:
    farm_subset: "NQ"
    raw_path: "data/farm/nq.jsonl"
    logical_field: "logical"
    n_questions: 150             # working sample size; raise once pipeline is verified
  boolq:
    farm_subset: "BoolQ"
    raw_path: "data/farm/boolq.jsonl"
    logical_field: "logical"
    n_questions: 150
  truthfulqa:
    farm_subset: "TruthfulQA"
    raw_path: "data/farm/truthfulqa.jsonl"
    logical_field: "logical"
    n_questions: 150

# -----------------------------------------------------------------------------
# Debate mechanics
# -----------------------------------------------------------------------------
debate:
  agent_counts: [3, 5]
  n_rounds: 3
  hallucination_setups:          # (n_incorrect, n_correct) at round 1, for agent_count=3
    - [3, 0]                     # lower bound
    - [2, 1]
    - [1, 2]
    - [0, 3]                     # upper bound (faithfulness-hallucination probe)
    - "standard"                 # genuine fresh round-1 generation, no seeding
  correct_pool_size: 5           # N_all in Appendix B-3
  correct_pool_sampling_attempts: 50

generation:
  max_tokens: 1024
  temperature: 1.0
  top_p: 1.0
  top_k: 50
  logprobs_topk: 20              # top-k logprobs requested per token, for entropy

# -----------------------------------------------------------------------------
# DIGRA core
# -----------------------------------------------------------------------------
digra:
  alpha: 0.2                     # balance parameter, eq. (8)
  max_partner_set_size: null     # null = unrestricted; set e.g. 2 for Fig. 8(c)-style runs
  early_stopping:
    consensus_required: true
    unchanged_rounds_threshold: 2

# -----------------------------------------------------------------------------
# RAG correction module (novelty component 1)
# -----------------------------------------------------------------------------
rag:
  enabled: true
  retriever: "bm25"               # "bm25" | "dense" — see src/rag/retriever.py
  corpus:
    nq: "wikipedia_dump"
    boolq: "boolq_native_passages"   # BoolQ ships its own gold passage — use it directly
    truthfulqa: "wikipedia_dump"     # weaker fit; documented as a known limitation
  top_k_passages: 5
  contradiction_detector: "nli"      # "nli" | "llm_judge"
  nli_model: "roberta-large-mnli"
  contradiction_threshold: 0.5       # NLI "contradiction" probability above which we flag
  entropy_inflation_factor: 2.0      # multiplicative penalty applied to H(R_j) in IGR denom

# -----------------------------------------------------------------------------
# Memory / trust module (novelty component 2)
# -----------------------------------------------------------------------------
memory:
  enabled: true
  initial_trust: 1.0
  flag_penalty: 0.3               # trust multiplier applied on a RAG contradiction flag
  consistency_reward: 0.05        # additive trust recovery per round without a flag
  min_trust: 0.1
  trust_weight_in_igr: 1.0        # exponent/weight applied to trust when folded into IGR

# -----------------------------------------------------------------------------
# Baselines to run for Table II-style comparison
# -----------------------------------------------------------------------------
baselines:
  - cot
  - cot_sc5
  - mad_standard
  - mad_sparse_half
  - mad_random
  - dig                            # IG-only ablation (no entropy normalization)
  - digra
  - digra_rag                      # + evidence-adjusted IGR
  - digra_rag_memory               # + persistent trust score
